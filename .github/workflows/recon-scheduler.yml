name: Recon scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: authorized-recon-worker
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.RECON_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-server/requirements.txt
      - name: Install dependencies
        run: pip install -r python-server/requirements.txt
      - name: Run scope safety tests
        working-directory: python-server
        run: python -m unittest discover -s tests -v
      - name: Run due recon jobs
        if: env.DATABASE_URL != ''
        working-directory: python-server
        env:
          RECON_MAX_JOBS_PER_RUN: "2"
          RECON_MAX_RUNTIME_SECONDS: "1200"
        run: python scheduled_runner.py
      - name: Wait for database setup
        if: env.DATABASE_URL == ''
        run: echo "Add the RECON_DATABASE_URL repository secret to enable the recon worker."
