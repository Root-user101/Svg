<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Search the Web</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh; color: #fff; font-family: Arial, Helvetica, sans-serif;
      background: #101827 url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=85") center/cover fixed no-repeat;
      display: flex; flex-direction: column;
    }
    body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg,rgba(5,12,24,.32),rgba(5,12,24,.68)); z-index: 0; }
    header, main, footer { position: relative; z-index: 1; }
    header { display:flex; justify-content:flex-end; align-items:center; gap:12px; padding:22px 26px; flex-wrap:wrap; }
    header a { color:#fff; text-decoration:none; font-size:14px; opacity:.92; }
    header a.lab, header a.bounty { border:1px solid #ffffff80; padding:8px 13px; border-radius:99px; background:#0b152c66; }
    header a.bounty { border-color:#55d6a0aa; background:#073b3266; }
    main { width:min(720px, calc(100% - 34px)); margin:auto; text-align:center; padding:70px 0 100px; }
    .eyebrow { letter-spacing:.22em; text-transform:uppercase; font-size:11px; color:#dbeafe; margin-bottom:18px; }
    h1 { font-size:clamp(42px, 9vw, 76px); line-height:1; margin:0 0 14px; font-weight:700; letter-spacing:-.055em; text-shadow:0 3px 22px #0008; }
    h1 span:nth-child(1) { color:#4285f4; } h1 span:nth-child(2) { color:#ea4335; } h1 span:nth-child(3) { color:#fbbc05; } h1 span:nth-child(4) { color:#4285f4; } h1 span:nth-child(5) { color:#34a853; } h1 span:nth-child(6) { color:#ea4335; }
    .sub { color:#f1f5f9; margin:0 0 32px; font-size:15px; text-shadow:0 2px 12px #000; }
    form { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.96); border:1px solid #ffffff80; border-radius:999px; padding:7px 8px 7px 20px; box-shadow:0 12px 40px #0005; }
    .search-icon { color:#64748b; font-size:20px; }
    input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:#172033; font-size:16px; padding:12px 2px; }
    button { border:0; border-radius:999px; background:#2563eb; color:white; font-weight:600; padding:13px 22px; cursor:pointer; font-size:14px; }
    button:hover { background:#1d4ed8; }
    .hint { margin-top:18px; font-size:12px; color:#e2e8f0; text-shadow:0 2px 10px #000; }
    footer { text-align:center; padding:18px; color:#e2e8f0; font-size:12px; text-shadow:0 2px 8px #000; }
    @media(max-width:520px) { header{padding:18px;gap:8px} main{padding:50px 0 80px} form{gap:5px;padding-left:15px} button{padding:12px 15px} input{font-size:15px} }
  </style>
</head>
<body>
  <header><a class="bounty" href="/bounty">🕷 Bug Bounty HQ</a><a class="lab" href="/lab">⚡ Cyber Lab</a><a href="https://www.google.com/" target="_blank" rel="noopener">Google</a></header>
  <main>
    <div class="eyebrow">Explore something new</div>
    <h1 aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></h1>
    <p class="sub">The world is one search away.</p>
    <form action="https://www.google.com/search" method="get" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" name="q" placeholder="Search anything on Google..." aria-label="Search Google" autofocus>
      <button type="submit">Search</button>
    </form>
    <div class="hint">Type a question, a place, an idea, or anything curious.</div>
  </main>
  <footer>Independent search homepage · Results powered by Google</footer>
</body>
</html>
